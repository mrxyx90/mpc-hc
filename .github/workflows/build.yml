name: Build MPC-HC

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install Visual Studio C++ ATL/MFC
        shell: pwsh
        run: |
          $installerDir = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir "vswhere.exe"
          $installer = Join-Path $installerDir "setup.exe"

          if (!(Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }
          if (!(Test-Path -LiteralPath $installer)) {
            throw "Visual Studio installer not found: $installer"
          }

          $installationPath = & $vswhere -latest -products * -property installationPath
          if (!$installationPath) {
            throw "Visual Studio installation not found"
          }

          & $installer modify --installPath "$installationPath" --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait

          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio ATL/MFC installation failed with exit code $LASTEXITCODE"
          }

      - name: Install MSYS2 and build dependencies
        shell: pwsh
        run: |
          choco install msys2 --no-progress -y
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Syu --noconfirm"
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gnutls mingw-w64-i686-gcc make perl"

      - name: Build MPC-HC x64 Release
        shell: cmd
        run: |
          set MPCHC_WINSDK_VER=10.0.26100.0
          set MPCHC_MINGW64=C:\msys64\mingw64
          set MPCHC_MINGW32=C:\msys64\mingw32
          set MPCHC_MSYS=C:\msys64
          call build.bat Build x64 Release

      - name: Collect build output
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "bin\mpc-hc_x64"
          $dst = Join-Path $env:GITHUB_WORKSPACE "artifact\MPC-HC-x64"
          if (!(Test-Path $src)) {
            throw "Build output not found: $src"
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-x64
          path: artifact/MPC-HC-x64
          if-no-files-found: error
          retention-days: 14
