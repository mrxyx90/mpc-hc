name: Build MPC-HC

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: false
        default: 'x64'
        type: choice
        options:
          - x64
          - x86
          - Both
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      installer:
        description: 'Also build Inno Setup installer (Release only)'
        required: false
        default: true
        type: boolean
      pdb:
        description: 'Upload PDB debug symbols artifact'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - develop
      - master
      - main
      - 'arena/**'
  pull_request:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.platform || 'x64' }} ${{ inputs.configuration || 'Release' }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch tags for version stamping
        shell: pwsh
        run: |
          git fetch --tags --unshallow 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --tags 2>$null
          }
          if (Test-Path "src/thirdparty/LAVFilters/src/.git") {
            git -C "src/thirdparty/LAVFilters/src" fetch --tags --unshallow 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C "src/thirdparty/LAVFilters/src" fetch --tags 2>$null
            }
          }
          exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip polib

      - name: Setup Visual Studio, NASM, and build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerDir = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir "vswhere.exe"
          $vsSetup = Join-Path $installerDir "setup.exe"

          if (!(Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          # Check if Visual Studio already has MSBuild, x86/x64 tools, and ATL/MFC installed
          $vsPath = & $vswhere -latest -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.ATLMFC Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) {
            $vsPath = & $vswhere -latest -products * -property installationPath
          }
          if (!$vsPath) {
            throw "Visual Studio installation not found"
          }

          $atlmfcHeaders = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Filter "afx.h" -Recurse -ErrorAction SilentlyContinue
          if (!$atlmfcHeaders) {
            Write-Host "Installing Visual Studio C++ ATL/MFC components into $vsPath..."
            & $vsSetup modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio component installation failed with exit code $LASTEXITCODE"
            }
          }
          Write-Host "Using Visual Studio: $vsPath"

          # Ensure NASM is installed and on PATH
          $nasmCmd = Get-Command nasm.exe -ErrorAction SilentlyContinue
          if (!$nasmCmd) {
            Write-Host "Installing NASM..."
            choco install nasm --no-progress -y
            $nasmPaths = @(
              "C:\Program Files\NASM",
              "C:\Program Files (x86)\NASM",
              "C:\ProgramData\chocolatey\bin"
            )
            foreach ($p in $nasmPaths) {
              if (Test-Path (Join-Path $p "nasm.exe")) {
                Add-Content -Path $env:GITHUB_PATH -Value $p
                $env:PATH = "$p;$env:PATH"
                break
              }
            }
          }
          nasm -v

          # Ensure Inno Setup >= 6.3.2 is installed (required by distrib\mpc-hc_setup.iss)
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          $needInnoUpgrade = $true
          if ($iscc) {
            $innoVer = [version](Get-Item $iscc).VersionInfo.FileVersion
            Write-Host "Found Inno Setup version: $innoVer at $iscc"
            if ($innoVer -ge [version]"6.3.2.0") {
              $needInnoUpgrade = $false
            }
          }
          if ($needInnoUpgrade) {
            Write-Host "Installing/upgrading Inno Setup (6.3.2+ required)..."
            choco upgrade innosetup --no-progress -y
          }

          # Detect latest installed Windows 10/11 SDK version
          $sdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include"
          $sdkVer = Get-ChildItem -Path $sdkIncludeRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "um\Windows.h") } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (!$sdkVer) {
            throw "No Windows 10/11 SDK found under $sdkIncludeRoot"
          }
          Write-Host "Using Windows SDK: $sdkVer"

          # Detect Python directory
          $pythonExe = (Get-Command python.exe).Source
          $pythonDir = Split-Path -Parent $pythonExe
          Write-Host "Using Python directory: $pythonDir"

          # Write build.user.bat for MPC-HC build scripts
          $buildUserBat = @(
            "@ECHO OFF",
            "SET `"MPCHC_VS_PATH=$vsPath`"",
            "SET `"MPCHC_WINSDK_VER=$sdkVer`"",
            "SET `"MPCHC_PYTHON=$pythonDir`"",
            "SET `"MPCHC_LAV_TOOLCHAIN=MSVC`""
          )
          Set-Content -Path "build.user.bat" -Value ($buildUserBat -join "`r`n") -Encoding ASCII
          Get-Content "build.user.bat"

      - name: Prepare DirectX redistributable DLLs
        shell: pwsh
        run: |
          $platform = "${{ inputs.platform || 'x64' }}"
          $dirs = @()
          if ($platform -in @("x64", "Both")) {
            $dirs += @{ Src = "distrib\x64"; Dst = "bin\mpc-hc_x64" }
          }
          if ($platform -in @("x86", "Both")) {
            $dirs += @{ Src = "distrib\x86"; Dst = "bin\mpc-hc_x86" }
          }
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d.Dst | Out-Null
            Copy-Item -Path (Join-Path $d.Src "D3DCompiler_47.dll") -Destination (Join-Path $d.Dst "d3dcompiler_47.dll") -Force
            Copy-Item -Path (Join-Path $d.Src "D3DX9_43.dll") -Destination (Join-Path $d.Dst "d3dx9_43.dll") -Force
          }

      - name: Build MPC-HC
        shell: cmd
        run: |
          set "PLATFORM=${{ inputs.platform || 'x64' }}"
          set "CONFIG=${{ inputs.configuration || 'Release' }}"
          set "EXTRA_ARGS="
          if /I "%CONFIG%" == "Release" (
            if /I "${{ inputs.installer == false && 'false' || 'true' }}" == "true" (
              set "EXTRA_ARGS=Installer"
            )
          )
          call build.bat Build %PLATFORM% MPCHC %CONFIG% %EXTRA_ARGS% Silent Nocolors

      - name: Show build error logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "bin\logs") {
            Get-ChildItem -Path "bin\logs" -Filter "*errors*.log" | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName
            }
          }

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:GITHUB_WORKSPACE "artifact\portable"
          $installerRoot = Join-Path $env:GITHUB_WORKSPACE "artifact\installer"
          $pdbRoot = Join-Path $env:GITHUB_WORKSPACE "artifact\pdb"
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null

          # Stage clean portable app folder(s) without .pdb, .lib, .exp, .ipdb, .iobj
          $outDirs = Get-ChildItem -Path "bin" -Directory -Filter "mpc-hc_*" -ErrorAction SilentlyContinue
          foreach ($dir in $outDirs) {
            $dest = if ($outDirs.Count -eq 1) { $portableRoot } else { Join-Path $portableRoot $dir.Name }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            Get-ChildItem -Path $dir.FullName -Recurse -File | ForEach-Object {
              $relPath = $_.FullName.Substring($dir.FullName.Length).TrimStart('\', '/')
              if ($_.Extension -in @(".pdb", ".lib", ".exp", ".ipdb", ".iobj")) {
                if ("${{ inputs.pdb }}" -eq "true") {
                  $pdbDest = Join-Path $pdbRoot (Join-Path $dir.Name $relPath)
                  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $pdbDest) | Out-Null
                  Copy-Item -Path $_.FullName -Destination $pdbDest -Force
                }
              } else {
                $fileDest = Join-Path $dest $relPath
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $fileDest) | Out-Null
                Copy-Item -Path $_.FullName -Destination $fileDest -Force
              }
            }

            # Copy Shaders, Shaders11, and COPYING.txt into the portable folder (same as SubCreatePackages in build.bat)
            $shaders9 = Join-Path $dest "Shaders"
            $shaders11 = Join-Path $dest "Shaders11"
            New-Item -ItemType Directory -Force -Path $shaders9 | Out-Null
            New-Item -ItemType Directory -Force -Path $shaders11 | Out-Null
            Copy-Item -Path "src\mpc-hc\res\shaders\dx9\*.hlsl" -Destination $shaders9 -Force
            Copy-Item -Path "src\mpc-hc\res\shaders\dx11\*.hlsl" -Destination $shaders11 -Force
            Copy-Item -Path "COPYING.txt" -Destination $dest -Force
          }

          # Stage installer .exe separately if built
          $installers = Get-ChildItem -Path "bin" -File -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($installers) {
            New-Item -ItemType Directory -Force -Path $installerRoot | Out-Null
            foreach ($inst in $installers) {
              Copy-Item -Path $inst.FullName -Destination $installerRoot -Force
            }
          }

          Write-Host "=== Portable contents ==="
          Get-ChildItem -Path $portableRoot -Recurse | Select-Object FullName, Length

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-${{ inputs.platform || 'x64' }}
          path: artifact/portable/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: ${{ (inputs.configuration || 'Release') == 'Release' && (inputs.installer == '' || inputs.installer == true || inputs.installer == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-${{ inputs.platform || 'x64' }}-Installer
          path: artifact/installer/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload PDB debug symbols
        if: ${{ inputs.pdb == true || inputs.pdb == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-${{ inputs.platform || 'x64' }}-PDB
          path: artifact/pdb/*
          if-no-files-found: warn
          retention-days: 14
